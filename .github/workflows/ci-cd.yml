name: CI/CD for Notification Service

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows manual execution

jobs:
  build-and-deploy:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Cache Maven dependencies to speed up build
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # Step 3: Set up Java 21 environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 4: Build and run tests
      - name: Build and test Notification Service
        working-directory: notification
        run: mvn clean verify -DskipTests=false

      # Step 5: Authenticate to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 6: Build and push the Docker image using Dockerfile-prod
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./notification
          file: ./notification/Dockerfile-prod
          push: true
          tags: karyna0dzen/notification:latest
