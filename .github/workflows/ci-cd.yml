name: CI/CD for Notification Service

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow to run this workflow manually

jobs:
  notification:
    runs-on: ubuntu-22.04

    steps:
      # 1. Clone repo
      - name: Checkout repository
        uses: actions/checkout@v3 #Checks out the code repository into the runner
                                  #so this workflow can access it. Without this, the
                                  #workflow couldn't access our shell script.

      # 2. Install JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      # 3. Build and test service
      - name: Build and test notification
        run: |
          cd notification
          mvn clean install

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build and push Docker-image
      - name: Build and push Docker image for notification
        uses: docker/build-push-action@v4
        with:
          context: ./notification
          push: true
          tags: karyna0dzen/notification:latest
