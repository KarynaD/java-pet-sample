name: CI/CD for Notification Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  notification:
    runs-on: ubuntu-22.04

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Установка JDK 21 для сборки
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      # 3. Сборка и тестирование сервиса
      - name: Build and test notification
        run: |
          cd notification
          mvn clean install

      # 4. Логин в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Сборка и публикация Docker-образа
      - name: Build and push Docker image for notification
        uses: docker/build-push-action@v4
        with:
          context: ./notification
          push: true
          tags: karyna0dzen/notification:latest
