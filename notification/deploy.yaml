apiVersion: v1
kind: ConfigMap
metadata:
  name: env-notification
data:
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "user"
  RABBITMQ_PASSWORD: "password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: karyna0dzen/notification:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: env-notification
          env:
            - name: PORT
              value: "8082"
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  selector:
    app: notification
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082